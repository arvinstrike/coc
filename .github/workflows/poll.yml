name: poll

on:
  schedule:
    - cron: "*/15 * * * *" # every 15 min (GitHub cron is best-effort, often late). Free only on a public repo.
  workflow_dispatch: {} # manual "Run workflow" button

permissions:
  contents: write # to commit polled data back

concurrency:
  group: poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    env:
      COC_API_TOKEN: ${{ secrets.COC_API_TOKEN }}
      COC_CLAN_TAGS: "#2RV22C9L9"
      SHEETS_WEBHOOK_URL: ${{ secrets.SHEETS_WEBHOOK_URL }}
      SHEETS_SECRET: ${{ secrets.SHEETS_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run sync
      - name: Commit polled data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: poll $(date -u +%FT%TZ)"
          git push
